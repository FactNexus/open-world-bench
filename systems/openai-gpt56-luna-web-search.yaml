# System 4 — ChatGPT approximation, class-matched to production's
# gemini-3-flash: gpt-5.6-luna (OpenAI's light tier) with OpenAI's
# own native web_search tool (Responses API), provider-direct. This is the
# same model + search stack the ChatGPT product uses, unlike third-party web
# plugins. If gpt-5.6-luna rejects the web_search tool, fall back to
# gpt-5.2-chat-latest (the ChatGPT alias line).
schema_version: 1
id: openai-gpt56-luna-web-search
name: GPT-5.6 (luna) with OpenAI native web search
adapter: openai
provider: openai
model: gpt-5.6-luna
strategy: native_search
capabilities:
  web_search: true
  citations: true
  token_metrics: true
  cost_metrics: true
settings:
  search_enabled: true
  max_tokens: 4096
  # Rates so the adapter computes cost_usd (gpt-5.6-luna, 2026): $0.20/$1.20 per
  # 1M in/out tokens + web_search tool at $10 per 1k calls (reasoning-model
  # rate; non-reasoning is $25/1k). Retrieved-content tokens are already in
  # input_tokens, so only the per-call fee is added here.
  cost:
    input_per_mtok: 0.20
    output_per_mtok: 1.20
    search_per_1k: 10
environment:
  api_key: OPENAI_API_KEY
