# Strategy 1 — own trained weights (closed book). Same gateway as
# native-search with search OFF: the model answers from parameters only.
# The honest baseline every retrieval strategy is measured against.
schema_version: 1
id: parametric-only
name: Closed-book model (no retrieval)
adapter: openrouter
provider: openrouter
model: anthropic/claude-opus-4.8   # any OpenRouter model id
strategy: parametric
capabilities:
  web_search: false
  citations: false
  token_metrics: true
  cost_metrics: true
settings:
  search_enabled: false
  max_tokens: 4096
environment:
  api_key: OPENROUTER_API_KEY
