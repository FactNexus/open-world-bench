schema_version: 1
id: everyday-essentials
name: Everyday essentials while travelling
version: 0.2.0  # 0.2.0 (2026-09-23): verifiable-details scored by the share of named services supported; hard gate only for a service shown to be fabricated, defunct or wrongly described
description: >
  A traveller needs an ordinary local service — a pharmacy, groceries,
  medical care — that is not tourism content but that travellers depend on.
  Tests whether a system covers everyday services in a place, not just
  attractions.
prompt: |
  {{ traveller.description | capitalize }} is partway through a stay in
  {{ location.name }}, {{ location.state_or_territory }}, and
  {{ need.description }}.

  Recommend specifically where they should go or what they should do,
  with enough practical detail to act on today: names, locations relative
  to the town or city centre, and current opening information. If the need
  cannot be met locally, say so clearly and give the most practical real
  alternative — the nearest place that can meet it, or a delivery,
  telehealth, or equivalent fallback. Support factual claims about
  businesses, services, and opening hours with current citations, and state
  uncertainty where the evidence is incomplete or stale.
parameters:
  location:
    source: location
  traveller:
    source: traveller
  need:
    source: essential_need
rules:
  # Child-specific needs only arise for a party travelling with children.
  - "not (need.requires_children == 1 and traveller.children == 0)"
criteria:
  - id: no-fabrication
    dimension: factual_consistency
    title: No named service is fabricated, defunct or wrongly described
    description: >
      A violation is a named business or service that the cited evidence
      shows does not exist, has closed, or does not offer the stated service
      or hours. Details that are merely unsupported are not a violation here;
      they are scored under verifiable-details.
    hard: true
    weight: 1.0
  - id: verifiable-details
    dimension: factual_consistency
    title: Named services and their details are supported
    description: >
      Score by the share of named businesses or services whose stated
      details — existence, location, services offered, opening hours — are
      supported by the cited evidence: all supported scores 1.0, none 0.0.
      A service the answer explicitly marks as unverified counts as half.
    weight: 2.0
  - id: practical-access
    dimension: constraint_satisfaction
    title: Recommendations are reachable for this traveller
    description: >
      Recommendations should be practically reachable given the traveller's
      situation — in particular, without a private car where the traveller
      has none — with distances or transport options stated.
  - id: need-coverage
    dimension: coverage
    title: The specific need is addressed
    description: >
      The answer should address the specific need, including its specifics
      (dietary safety, medication access, timing), rather than generic
      shopping or services information.
  - id: availability-honesty
    dimension: clarity
    title: Local unavailability is acknowledged with a real fallback
    description: >
      Where the need cannot be met in the location — common in small or
      remote places — the answer should say so plainly and give a genuine,
      current alternative rather than forcing an unsuitable local option.
  - id: citation-freshness
    dimension: citation_support
    title: Service details are supported by current sources
    description: >
      Opening hours and service claims change often; they should be
      supported by suitably fresh sources cited close to the relevant
      statements.
answer_contract:
  format: markdown
  citations_required: true
  instructions:
    - Lead with the single best recommendation, then alternatives.
    - State opening information and how to get there for each option.
tags: [everyday-services, pharmacy, groceries, medical, practical]
difficulty: medium
