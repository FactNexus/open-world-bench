schema_version: 1
id: australian-tourism
name: Australian tourism
description: >
  Open-world research and recommendation scenarios concerning travel and tourism
  within Australia.
version: 0.3.0
default_locale: en-AU
default_timezone: Australia/Sydney
templates:
  - scenarios/*.yaml
parameters:
  location:
    description: Australian city, town, or tourism region used as a scenario base.
    provider:
      type: csv
      path: values/locations.csv
      options:
        id_field: id
        weight_field: sampling_weight
  traveller:
    provider:
      type: yaml_list
      path: values/travellers.yaml
  interest:
    provider:
      type: yaml_list
      path: values/interests.yaml
  constraint:
    provider:
      type: yaml_list
      path: values/constraints.yaml
  access_need:
    description: Accessibility requirement that recommendations must meet with explicit evidence.
    provider:
      type: yaml_list
      path: values/access-needs.yaml
  transport:
    description: Transport situation for remote-area planning.
    provider:
      type: yaml_list
      path: values/transport.yaml
  condition:
    description: Forecast weather condition, constrained to compatible seasons by template rules.
    provider:
      type: yaml_list
      path: values/weather.yaml
  essential_need:
    description: >-
      Everyday non-tourism need (pharmacy, groceries, medical care) a traveller
      must meet while away from home.
    provider:
      type: yaml_list
      path: values/essential-needs.yaml
source_policy: source-policy.yaml
licence: MIT for authored templates; source datasets retain their own licences
attribution: []
metadata:
  maturity: beta
  intended_public_release: true
  location_snapshot:
    source: hand-curated by OWRB contributors (no OpenStreetMap or other database extracts)
    snapshot_date: "2026-07-18"
    coordinate_precision: approximate (about 1 km); scenario-generation input only, never evidence
    row_count: 76
    licence: MIT (part of the authored domain pack)
