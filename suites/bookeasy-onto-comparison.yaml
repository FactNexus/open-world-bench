# Bookeasy ontology comparison: production shape (gemini-3-flash +
# edge-search) as control vs the same stack with the ontology, a
# class-matched alternative model (Haiku 4.5) on the onto stack, and two
# provider-native web-search baselines approximating ChatGPT and Gemini —
# all candidates in the same fast-tier model class as production.
#
# Same seed as the public dev suite, so the 100 frozen instances are
# identical to examples/dev-suite/.
#
# Before running:
#   source ~/.owrb.env
#   ssh -N -L 8096:127.0.0.1:8096 rocky@launchlive &   # edge-search tunnel
#   (pause edge-index's crawl on launchlive for the duration — latency fairness)
schema_version: 1
id: bookeasy-onto-comparison
name: Bookeasy ontology comparison (control vs onto vs provider search)
domain:
  id: australian-tourism
  path: domains/australian-tourism
scenario_generation:
  seed: 20260718
  count: 100
  template_quotas:
    nearby-discovery: 15
    constrained-day-plan: 15
    compare-destinations: 10
    accessible-experiences: 15
    season-adaptation: 10
    remote-area-plan: 10
    multi-stop-itinerary: 15
    everyday-essentials: 10
systems:
  - systems/edge-search-control-gemini-flash.yaml
  - systems/edge-search-onto-gemini-flash.yaml
  - systems/edge-search-onto-haiku45.yaml
  - systems/openai-gpt56-luna-web-search.yaml
  # Faithful Gemini approximation: native Google Search grounding (GEMINI_API_KEY).
  # Fallback if grounding quota lapses: systems/gemini36-openrouter-web-search.yaml
  # (OpenRouter + Exa web plugin — kept in the repo, out of the suite).
  - systems/gemini-native-grounding.yaml
repetitions: 1
randomise_system_order: true
concurrency: 2
run_timeout_seconds: 600
evaluation:
  quality_weights:
    constraint_satisfaction: 25
    citation_support: 25
    factual_correctness: 20
    coverage: 15
    source_quality_freshness: 10
    clarity: 5
  hard_constraint_score_cap: 49
  evidence_cache: true
  # Judge: open-weights, no family overlap with any candidate (no
  # self-preference), cheap enough for ~500 trials of claim decomposition +
  # citation verdicts + rubric scoring.
  judge:
    adapter: openrouter
    model: openai/gpt-oss-120b
reporting:
  static_html: true
  export_json: true
  export_csv: true
